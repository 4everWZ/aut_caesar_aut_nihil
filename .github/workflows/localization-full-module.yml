name: Chinese full-module installer

on:
  push:
    tags: ['zh-cn-full-module-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and check translations
        run: |
          python -B -m unittest discover -s tools/localization -p 'test_*.py'
          python -B tools/localization/check.py --check
      - name: Install pinned font builder dependencies
        run: python -m pip install -r tools/localization/font_candidate/requirements.txt
      - name: Generate licensed Chinese font
        run: bash tools/localization/prepare_full_font.sh "$RUNNER_TEMP/full-font"
      - name: Build and verify complete runtime archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-report"
          python -B tools/localization/package_module.py --font-dir "$RUNNER_TEMP/full-font" \
            --output "$RUNNER_TEMP/ACAN-zh-cn-full-module.zip" > "$RUNNER_TEMP/full-report/build.log"
          cd "$RUNNER_TEMP"
          sha256sum ACAN-zh-cn-full-module.zip > full-report/SHA256SUMS
          cp full-font/font_report.json full-report/
      - name: Upload verification evidence only
        uses: actions/upload-artifact@v4
        with:
          name: full-module-verification
          path: ${{ runner.temp }}/full-report/*
          if-no-files-found: error
      - name: Record redistribution evidence
        run: |
          cat docs/localization/ROMAN_MODELS_PERMISSION.md >> "$GITHUB_STEP_SUMMARY"
          echo 'Full-module archive built and hash-verified. User authorized publication; the model-pack permission category remains unconfirmed. No upstream audio or translation-ID count blocks the build.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish full-module prerelease
        if: startsWith(github.ref, 'refs/tags/zh-cn-full-module-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum --check full-report/SHA256SUMS
          cp full-report/SHA256SUMS SHA256SUMS
          cat > notes.md <<'NOTES'
          ACAN 简体中文完整模组安装包预览版，保留上游基线 3ed34f35c94c974f9d2a9102750dbb4866e38f6d。
          整合汉化 CSV、OFL 中文字体、完整 MIT/OFL 许可及上游署名；排除 fxc.exe 等开发工具。
          未实机测试；汉化仍有英文回退，字体渲染、GPU 兼容及游戏运行效果尚未验证。
          上游原有 woman_death_12.wav、disease_sound.wav、riot_sound.wav 缺失保持不变，实际运行影响未知。
          Roman Models Extravaganza 的具体许可适用类别仍待作者确认；用户已授权此次发布，这不等于新增作者授权。
          需要合法安装的 Mount & Blade: Warband。备份原模组后，将压缩包 Modules/Aut_Caesar_Aut_Nihil 放入游戏 Modules 目录，选择简体中文。
          NOTES
          gh release create "$RELEASE_TAG" ACAN-zh-cn-full-module.zip SHA256SUMS \
            --verify-tag --prerelease --latest=false \
            --title "ACAN 完整模组汉化预览版 $RELEASE_TAG" --notes-file notes.md
